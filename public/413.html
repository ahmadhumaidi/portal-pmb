<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>File Terlalu Besar | Portal PMB</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #111827; font-family: Arial, sans-serif; }
        main { width: min(92vw, 560px); background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; box-shadow: 0 24px 70px rgba(15, 23, 42, .12); }
        .badge { display: inline-block; padding: 8px 12px; border-radius: 999px; background: #fee2e2; color: #991b1b; font-weight: 700; font-size: 13px; }
        h1 { margin: 18px 0 10px; font-size: 26px; line-height: 1.2; color: #111827; }
        p { margin: 0; color: #475569; line-height: 1.7; }
        a { display: inline-block; margin-top: 22px; padding: 12px 20px; border-radius: 8px; background: #2563eb; color: white; text-decoration: none; font-weight: 700; }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <main>
        <span class="badge">Upload gagal</span>
        <h1>File yang diunggah terlalu besar.</h1>
        <p>Total ukuran file pada form ini melebihi batas maksimal yang diizinkan server. Mohon periksa kembali ukuran file (maksimal 5 MB per file), kompres jika perlu, lalu coba unggah ulang.</p>
        <a href="javascript:history.back()">Kembali</a>
    </main>
</body>
</html>
